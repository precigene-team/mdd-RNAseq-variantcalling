# ==============================================================================
# Pipeline Configuration  —  02_dge_analysis/config.yaml
#
# Execution order:
#   01_core_alignment (08_quantification.sh → 09_counts_qc.sh → 10_multiqc.sh)
#   →  02_dge_analysis (01_gene_mapping.R → … → 09_heatmap_pathway.R)
#   →  03_variant_calling
#
# This file supplies the Ensembl annotation parameters consumed by the DGE
# module. Paths are not configured here: scripts 01–09 resolve their own
# inputs from the project root.
#
# Consumers:
#   01_gene_mapping.R:38      cfg$ensembl_map$valid_biotypes
#   06_annotate_results.R:81  cfg$ensembl_map$ensembl_version
# ==============================================================================

# Key name `ensembl_map` is the path 01 and 06 read.
ensembl_map:
  # Ensembl release used by BioMart in 06_annotate_results.R (useEnsembl).
  # Matches the GTF 01_gene_mapping.R parses: Homo_sapiens.GRCh38.115.gtf.
  ensembl_version: 115

  # Biotypes kept when ENSG IDs are resolved to HGNC symbols in 01_gene_mapping.R.
  valid_biotypes:
    - "protein_coding"
