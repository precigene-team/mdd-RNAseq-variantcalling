name: mdd
channels:
  - conda-forge
  - bioconda
  # - defaults
dependencies:
  # Upstream Core Tools
  - star
  - samtools
  - bcftools
  - bedtools
  - subread
  - multiqc
  - picard
  - gatk4
  - trimmomatic
  - fastqc
  - qualimap
  - aspera-cli
  - fastp
  - meme
  - maven

  # Python Stack
  - python=3.9
  - pandas
  - matplotlib
  - tqdm
  - pygenometracks
  - igv-reports
  - pip
  
  # R Stack
  - r-base=4.3
  - r-tidyverse
  - r-yaml
  - r-plotly
  - r-htmlwidgets
  - r-ggrepel
  - r-msigdbr
  - r-ggtext
  - r-biocmanager
  - r-ashr
  - r-glmmtmb
  - r-lme4
  - bioconductor-deseq2
  - bioconductor-biomart
  - bioconductor-apeglm
  - bioconductor-limma
  - bioconductor-clusterprofiler
  - bioconductor-org.hs.eg.db
  - bioconductor-tress
  - bioconductor-rrho
  - bioconductor-complexheatmap
