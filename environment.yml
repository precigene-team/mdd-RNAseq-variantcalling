name: mdd
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Upstream Core Tools
  - star
  - samtools
  - subread
  - multiqc
  - picard
  - gatk4
  - trimmomatic
  - fastqc
  - qualimap
  - aspera-cli
  - fastp

  # Python Stack
  - python=3.9
  - pandas
  - tqdm
  - pip
  - pip:
    - macs2
  
  # R Stack
  - r-base=4.3
  - r-tidyverse
  - r-yaml
  - r-plotly
  - r-htmlwidgets
  - r-ggrepel
  - r-msigdbr
  - r-ggtext
  - bioconductor-deseq2
  - bioconductor-biomart
  - bioconductor-apeglm
  - bioconductor-limma
  - bioconductor-clusterprofiler
  - bioconductor-org.hs.eg.db
