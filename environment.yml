name: mdd
channels:
  - conda-forge
  - bioconda
dependencies:
  # Upstream Core Tools
  - star
  - samtools
  - bcftools
  - bedtools
  - subread
  - multiqc
  - picard
  - gatk4
  - trimmomatic
  - fastqc
  - qualimap
  - aspera-cli
  - fastp
  - meme
  - maven

  # Python Stack
  - python=3.9
  - pandas
  - matplotlib
  - tqdm
  - pygenometracks
  - igv-reports
  - pip
  - numpy
  - scipy
  - requests
  - pyfaidx
  - lxml
  - statsmodels

  # R Stack
  - r-base=4.3
  - r-base-core=4.3
  - r
  - r-essentials
  - r-tidyverse
  - r-dplyr
  - r-readr
  - r-stringr
  - r-yaml
  - r-deseq2
  - r-limma
  - r-biocmanager
  - r-ggplot2
  - r-ggrepel
  - r-ggtext
  - r-plotly
  - r-htmlwidgets
  - r-rcolorbrewer
  - r-circlize
  - r-complexheatmap
  - r-patchwork
  - r-scales
  - r-clusterprofiler
  - r-org.hs.eg.db
  - r-msigdbr
  - bioconductor-ashr
  - bioconductor-go.db
  - r-jsonlite
  - r-data.table
